spring:
  application:
    name: algo_lens
  config:
    import: optional:application-secret.yml

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 300000


logging:
  level:
    org.springframework.cache: TRACE
    io.netty.resolver.dns.DnsServerAddressStreamProviders: OFF




spring:
  application:
    name: algo_lens
  config:
    import: optional:application-secret.yml

  datasource:
    url: jdbc:mysql://mysql:3306/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  cache:
    type: redis
    redis:
      time-to-live: 300000

codeforces:
  handle: ${CF_HANDLE}
  password: ${CF_PASSWORD}

logging:
  level:
    org.springframework.cache: TRACE
    io.netty.resolver.dns.DnsServerAddressStreamProviders: OFF